spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/car_leaderboard_test
      # @DataMongoTest's own slice defaults otherwise win over the URI's db name and silently
      # point at a plain "test" database, so this is set explicitly too.
      database: car_leaderboard_test
    redis:
      host: localhost
      port: 6379
      database: 1   # separate logical DB from dev's (0), so tests never touch real leaderboard data
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email

app:
  frontend-url: http://localhost:5173
